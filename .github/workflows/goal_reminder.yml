name: 十日目標提醒

on:
  # 原本註解說「改由 APScheduler 在 Render 上執行」，但那個排程其實是死的
  # （from state import cron_is_done 會 ImportError），所以這個提醒長期沒在跑。
  # 排程改回這裡，對應原本 APScheduler 的台北 21:00。
  schedule:
    - cron: '0 13 * * *'   # 21:00 CST
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run goal reminder
        working-directory: scripts
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOAL_SHEET_ID: ${{ secrets.GOAL_SHEET_ID }}
        run: python goal_reminder.py
