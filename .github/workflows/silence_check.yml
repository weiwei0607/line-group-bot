name: 沉默偵測

on:
  # 原本停用是因為「APScheduler 每天 12:00 已在做」，但那個排程其實是死的
  # （from state import cron_is_done 會 ImportError），所以冷場偵測長期沒在跑。
  # 改回每天一次，時間對齊原本 APScheduler 的台北 12:00。
  # 刻意不恢復原本的每 6 小時，避免又變成訊息轟炸。
  schedule:
    - cron: '0 4 * * *'    # 12:00 CST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run silence check
        working-directory: scripts
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOAL_SHEET_ID: ${{ secrets.GOAL_SHEET_ID }}
          SILENCE_HOURS: "48"
        run: python silence_check.py
